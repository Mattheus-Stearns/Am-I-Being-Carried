{% extends "layout.html" %}

{% block title %}Results - Am I Being Carried{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4><i class="fas fa-check-circle"></i> Am I Being Carried Results</h4>
            </div>
            <div class="card-body">
                {% if data %}
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                           
                        </table>
                    </div>
                {% else %}
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i> No data available. Please search your epic username first.
                    </div>
                {% endif %}
            </div>
            <div class="card-footer">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
                <button onclick="handleApiQuery()" class="btn btn-success">
                    <i class="fas fa-sync"></i> Refresh Data
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
